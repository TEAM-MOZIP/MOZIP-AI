[project]
name = "mozip-ai"
version = "0.1.0"
description = "MOZIP의 AI 서버"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rdflib>=7.6.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
evaluation = [
    "huggingface-hub>=1.27.0",
    "pyarrow>=25.0.1",
]

[tool.pytest.ini_options]
testpaths = ["app/tests", "evaluation/nemotron/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
