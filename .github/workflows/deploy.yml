name: Deploy AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true

      # app/tests만 대상으로 한다 — pyproject.toml의 testpaths는
      # evaluation/nemotron/tests도 포함하지만, 그 테스트는 pyarrow(evaluation
      # dependency-group, uv 기본 미설치 그룹)를 import해서 dev group만 있는
      # 이 CI 환경에서는 애초에 collection이 실패한다. evaluation은 별도
      # 오프라인 데이터 파이프라인 도구로, 배포 대상 이미지에도 포함되지
      # 않는다(.dockerignore로 제외). 실제로 배포되는 애플리케이션(app/)의
      # 테스트만 배포 게이트로 삼는다.
      - name: Run tests
        run: uv run pytest app/tests -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/team-mozip/mozip-ai:${{ github.sha }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_USER: ${{ secrets.EC2_SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push AI image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}

      - name: Prepare SSH key and known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy AI container on EC2
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$EC2_SSH_USER@$EC2_HOST" \
            "NEW_SHA='${{ github.sha }}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          # deploy/ SSOT는 MOZIP-SERVER 저장소에 있다(docker-compose.yml/.deploy-tags.env
          # 등 배포 구성 전체가 그쪽에서 관리됨) — AI 저장소 자체에는 deploy/ 디렉터리가 없다.
          cd ~/MOZIP-SERVER/deploy

          set -a
          source .deploy-tags.env
          set +a

          # AI_IMAGE_TAG는 아직 .deploy-tags.env에 쓰지 않는다 — 새 컨테이너가 healthy로
          # 확인되기 전까지는 파일이 이전(정상 동작 확인된) SHA를 그대로 유지해야, 만약 health가
          # 실패했을 때 이 파일이 "마지막으로 검증된 정상 상태"를 정확히 가리킨다. 대신 이번 pull/up
          # 호출에만 새 SHA를 명령 단위로 일시 주입한다. SERVER_IMAGE_TAG는 이 워크플로 어디에서도
          # 참조/변경하지 않는다.
          AI_IMAGE_TAG="${NEW_SHA}" docker compose --env-file .env pull ai
          AI_IMAGE_TAG="${NEW_SHA}" docker compose --env-file .env up -d --no-deps ai

          healthy=false
          for i in $(seq 1 12); do
            # ai 서비스는 host에 port를 publish하지 않으므로(compose 설계상 내부 전용)
            # host에서 localhost:8000은 도달 불가능하다 — 컨테이너 내부에서 직접 확인한다
            # (-T: 비대화형 CI 환경이라 TTY 비할당).
            if AI_IMAGE_TAG="${NEW_SHA}" docker compose --env-file .env exec -T ai \
                curl -sf http://localhost:8000/api/v1/health | grep -q '"status":"ok"'; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "AI health check failed after retries (SHA: ${NEW_SHA}); .deploy-tags.env left unchanged (still points at last known-good SHA)"
            exit 1
          fi

          echo "AI is healthy (SHA: ${NEW_SHA})"

          # health 확인이 끝난 뒤에야 .deploy-tags.env를 새 SHA로 확정한다.
          # 패턴이 ^AI_IMAGE_TAG=로 고정되어 있어 SERVER_IMAGE_TAG 줄은 구조적으로 건드릴 수 없다.
          sed -i "s/^AI_IMAGE_TAG=.*/AI_IMAGE_TAG=${NEW_SHA}/" .deploy-tags.env
          chmod 600 .deploy-tags.env

          # sed는 치환 대상 줄이 없어도(예: 파일 형식이 예상과 달라졌거나 패턴이 어긋난 경우)
          # exit code 0을 반환하므로, 실제로 원하는 줄이 정확히 반영됐는지 별도로 검증한다.
          if ! grep -qx "AI_IMAGE_TAG=${NEW_SHA}" .deploy-tags.env; then
            echo "Failed to verify AI_IMAGE_TAG=${NEW_SHA} in .deploy-tags.env after sed"
            exit 1
          fi

          AI_IMAGE_TAG="${NEW_SHA}" docker compose --env-file .env ps ai
          REMOTE_SCRIPT
